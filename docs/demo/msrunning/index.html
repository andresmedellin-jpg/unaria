<!DOCTYPE html>
<html lang="es" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MS Running · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: la marca de msrunning.com: oscura, seria, de alto rendimiento.
   IDEA: el tablero de un equipo de competencia, no una app de juguete.
   PICTURE: la bandeja con la lectura de la IA; en el atleta, su semana como lista de días.
   COLOUR: negro #0E0E0F, hueso #F5F0E6 y naranja #FF4D2E, igual que su página.
   TYPE: Archivo Black en mayúsculas para títulos, Inter para texto, JetBrains Mono para etiquetas. LAYOUT: barra, 4 pestañas, rejilla de 3 columnas que se apila en celular. */
:root{color-scheme:light;--bg:#f5f0e6;--card:#fffdf8;--card2:#faf6ee;--ink:#0e0e0f;--on:#fffdf8;--mute:rgba(14,14,15,.58);--line:rgba(14,14,15,.12);--red:#ff4d2e;--redsoft:rgba(255,77,46,.08);--sel:rgba(14,14,15,.04);
--z1:rgba(14,14,15,.18);--z2:rgba(14,14,15,.38);--z3:rgba(14,14,15,.7);--z4:#ff9a7f;--z5:#ff4d2e;--ok:#0e0e0f;--warn:#c25a00}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Archivo Black",Inter,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;margin:0;line-height:1.05}
.num{font-family:"Archivo Black",Inter,sans-serif;font-weight:400;letter-spacing:-.02em}
.mono,.ch,.tag,.pill,.note,.k,th,.filters button,.seg button,nav button,.ptabs button,button{font-family:"JetBrains Mono",ui-monospace,monospace}
button,input,textarea,select{font-size:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:4px;border:1px solid var(--line);background:transparent;padding:0 16px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.prim,.redb{background:var(--red);color:var(--on);border-color:var(--red);font-weight:600}
.prim:hover,.redb:hover{filter:brightness(1.08);border-color:var(--red)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px max(3vw,14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:"Archivo Black";font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.brand small{color:var(--mute);font:12px "JetBrains Mono",monospace}
.logo{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px}
.seg button{border:0;min-height:38px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--on)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px max(3vw,14px) 0;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute)}
nav button.on{color:var(--ink);border-color:var(--red)}
nav .cnt{color:var(--red);margin-left:6px}
main{padding:18px max(3vw,14px) 48px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;margin-bottom:16px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stats .card{border:0;border-radius:0}
.stat{padding:16px 18px}.stat .num{font-size:clamp(30px,3vw,40px);line-height:1}.stat span{display:block;margin-top:6px;color:var(--mute);font-size:13px}
.inbox{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr) minmax(0,340px);gap:12px;align-items:start}
.list{overflow:hidden}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px}
.filters button{min-height:32px;padding:0 10px;font-size:11px;border-radius:99px;color:var(--mute)}
.filters button.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.conv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:start;border-left:2px solid transparent}
.conv:hover{background:var(--sel)}
.conv.on{background:var(--sel);border-left-color:var(--red)}
.conv b{display:block;font-weight:600}.conv p{margin:3px 0 0;color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:12px "JetBrains Mono",monospace;color:var(--ink);border:1px solid var(--line);background:var(--card2)!important}
.ch,.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-radius:3px;padding:1px 6px;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.ch::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--mute)}
.ch.wa::before{background:#3ddc84}.ch.ig::before,.ch.igp::before{background:#ff7aa8}.ch.web::before{background:var(--ink)}.ch.app::before{background:var(--red)}
.tag.les{background:var(--red);color:var(--on);border-color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.chat{display:flex;flex-direction:column;min-height:580px}
.chead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--ink);color:var(--on);border-color:var(--ink)}
.m small{display:block;opacity:.55;font:11px "JetBrains Mono",monospace;margin-top:4px}
.reply{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.reply textarea,.plan textarea,#q{width:100%;min-height:120px;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--bg);font:15px/1.5 Inter,sans-serif;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai{padding:16px;display:grid;gap:14px}
.ai h3{font-size:15px}
.k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.box{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--card2)}
.box.alert{border-color:var(--red);background:var(--redsoft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv>span:nth-child(odd){color:var(--mute);font:11px/1.9 "JetBrains Mono",monospace;text-transform:uppercase}
.zones{display:grid;gap:5px}
.zr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-size:13px}
.zr b{font:11px "JetBrains Mono",monospace;color:var(--mute)}
.zr i{height:6px;border-radius:1px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--mute);font-weight:400;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right;white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:1px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:currentColor}
.p-ok{color:var(--mute)}.p-warn{color:var(--warn)}.p-bad{color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
.pad{padding:18px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-top:10px;background:var(--line);border:1px solid var(--line)}
.wk div{background:var(--card);padding:8px;font-size:13px;min-height:84px}
.wk b{display:block;font:11px "JetBrains Mono",monospace;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.note{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--on);padding:12px 18px;border-radius:4px;transition:transform .3s;z-index:9;max-width:92vw;font:13px "JetBrains Mono",monospace}
#toast.on{transform:translateX(-50%)}
.phone{max-width:430px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.phead{padding:22px 20px 18px;background:var(--card2);border-bottom:1px solid var(--line)}
.phead .note{color:var(--red)!important;opacity:1!important;text-transform:uppercase;letter-spacing:.06em}
.phead h2{font-size:30px;margin-top:6px}
.count{display:flex;gap:12px;align-items:baseline;margin-top:14px}
.count .num{font-size:64px;line-height:.9;color:var(--red)}
.count span:last-child{font:12px "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase}
.ptabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.ptabs button{border:0;border-radius:0;font-size:11px;color:var(--mute);min-height:50px;padding:0 4px}
.ptabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--red)}
.pbody{padding:16px;display:grid;gap:10px;min-height:520px;align-content:start}
.pbody h3{font-size:16px;margin-top:6px}
.day{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--card2)}
.day.today{border-color:var(--red)}
.day .d{font:400 24px/1 "Archivo Black",sans-serif;text-align:center}.day .d small{display:block;font:10px "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;margin-top:4px}
.day b{font-weight:600}.day p{margin:3px 0 0;font-size:13px;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--line)}
.chk.y{background:var(--ink);border-color:var(--ink);color:var(--on)}
.zb{display:inline-block;font:10px "JetBrains Mono",monospace;color:var(--on);border-radius:2px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.split div{background:var(--card2);padding:12px 6px;text-align:center}
.split .num{font-size:26px;margin-top:4px}
.login{max-width:400px;margin:40px auto;padding:26px;display:grid;gap:14px}
.login label{font:11px "JetBrains Mono",monospace;text-transform:uppercase;color:var(--mute);display:grid;gap:6px}
.login input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:4px;padding:0 12px;background:var(--bg);font:16px Inter,sans-serif;color:var(--ink);text-transform:none}
ul.cl{margin:0;padding-left:18px;color:var(--mute);font-size:14px}
@media(max-width:1100px){.inbox{grid-template-columns:minmax(0,300px) minmax(0,1fr)}.inbox .aiw{grid-column:1/-1}}
@media(max-width:760px){.inbox,.two{grid-template-columns:1fr}.wk{grid-template-columns:repeat(2,minmax(0,1fr))}.m{max-width:92%}.chat{min-height:0}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font:11px "JetBrains Mono",monospace;text-transform:uppercase}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

  <button id="pagar" style="min-height:48px;border:0;border-radius:6px;background:#0570de;color:#fff;font:600 15px Inter,sans-serif;text-transform:none;letter-spacing:0">${pago.proc?'Procesando…':pago.metodo==='Tarjeta'?'Pagar $999':pago.metodo==='OXXO'?'Generar ficha OXXO':'Ver mi CLABE'}</button>
  <span style="font:12px Inter,sans-serif;color:#6d6e78;text-align:center">Pago seguro con <b>stripe</b></span>
 </div>`}
 <div><div class="k">Historial</div>${[['Noviembre','1 nov','Visa 4417'],['Octubre','2 oct','Visa 4417'],['Septiembre','1 sep','OXXO']].map(r=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${r[0]}</b><br><span class="note">$999 · ${r[1]} · ${r[2]}</span></div><button data-recibo="${r[0]}" style="min-height:32px;font-size:10px">Recibo</button></div>`).join('')}</div>`}

 if(t.id==='stadd'){DR[fsel].nut[eseg[fsel]].push(['Nuevo paso','Escribe la indicación']);renderCoach();document.getElementById('strat').scrollIntoView({block:'nearest'});return}
 if(t.id==='strecalc'){const d=makeST(fsel);d.pub=ST[fsel]?.pub||'';d.indic=DR[fsel].indic;d.segs=DR[fsel].segs;DR[fsel]=d;renderCoach();document.getElementById('strat').scrollIntoView({block:'nearest'});toast('Recalculado con su perfil de sudor. Revisa y publica.');return}
 if(t.id==='stpub'){const d=clone(DR[fsel]);d.pub='19 nov';ST[fsel]=d;DR[fsel]=clone(d);toast('Estrategia publicada. '+A(fsel).n.split(' ')[0]+' ya la ve en su app y le llega aviso (demo)');renderCoach();document.getElementById('strat').scrollIntoView({block:'nearest'});return}
 if(t.id==='stcopy'){const a=A(fsel);athletes.filter(x=>x.id!==a.id&&x.ev===a.ev).forEach(x=>{genST(x);const d=clone(DR[fsel]);d.segs=ST[x.id].segs;d.indic=ST[x.id].indic;d.basada=ST[x.id].basada;d.pub=ST[x.id].pub;DR[x.id]=d});toast('Listo: la usé de base para los demás, con sus propios ritmos y potencias. Revísalas antes de publicar.');return}

 if(t.id==='aprob'){listas[fsel]=1;const n=A(fsel).n;const sig=athletes.slice().sort((x,y)=>prio(y)-prio(x)).find(x=>!listas[x.id]);toast('Semana de '+n+' enviada a TrainingPeaks y a su reloj (demo)');if(sig)fsel=sig.id;renderCoach();return}
  if(t.dataset.fa){fsel=t.dataset.fa;renderCoach();return}

 if(t.id==='ask2'){const v=$('#q').value.trim();if(!v)return;
