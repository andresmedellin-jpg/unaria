<!doctype html>
<!-- DEMO de Unaria para Chilabike: "Arma tu cajita" — el menú interactivo que se abre desde WhatsApp, Instagram o Messenger.
     Paso a paso, como en Subway: salsa → proteína → toppings → bebida → entrega → pago. También cotiza eventos (?modo=evento).
     Dentro del simulador (iframe) avisa a la conversación con postMessage; suelto, guarda el pedido en este navegador
     (localStorage "chilabike-demo-pedidos") y el portal del demo lo muestra en Mensajes. Precios de muestra. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arma tu cajita · Chilabike (demo)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121110">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root { --negro:#121110; --crema:#FBF6EF; --papel:#fff; --linea:#E9E1D6; --naranja:#F26B1D; --naranja-osc:#C9500C; --suave:#FDE8DA; --texto:#2B2724; --gris:#6E6760;
  --f-disp:'Bricolage Grotesque','Arial Black',Arial,sans-serif; --f-txt:'DM Sans',Arial,sans-serif; color-scheme:light; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { background:var(--crema); color:var(--texto); font:400 16px/1.45 var(--f-txt); -webkit-font-smoothing:antialiased; }
.app { max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--crema); }
header { position:sticky; top:0; z-index:5; background:var(--negro); color:#fff; padding:12px 16px 10px; }
header .fila { display:flex; align-items:center; gap:10px; }
header .logo { width:30px; height:30px; border-radius:50%; background:var(--naranja); display:grid; place-items:center; font-size:14px; }
header b { font-family:var(--f-disp); font-size:18px; letter-spacing:-.01em; }
header small { margin-left:auto; color:#BDB4A9; font-size:12px; }
.pasos { display:flex; gap:4px; margin-top:10px; }
.pasos i { flex:1; height:4px; border-radius:2px; background:#3A3633; transition:background .3s; }
.pasos i.on { background:var(--naranja); }
main { flex:1; padding:18px 16px 120px; }
.paso { display:none; } .paso.anim { animation:entra .3s ease both; }
.paso.on { display:block; }
@keyframes entra { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
h1 { font-family:var(--f-disp); font-size:28px; line-height:1.05; letter-spacing:-.02em; margin:0 0 4px; color:var(--negro); }
.ayuda { color:var(--gris); font-size:14.5px; margin:0 0 16px; }
.grid { display:grid; gap:10px; }
.g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.op { position:relative; display:flex; flex-direction:column; gap:4px; text-align:left; font:inherit; color:inherit; background:var(--papel); border:2px solid var(--linea); border-radius:16px; padding:12px; cursor:pointer; transition:transform .12s, border-color .15s, box-shadow .15s; min-height:64px; }
.op:active { transform:scale(.97); }
.op.on { border-color:var(--negro); box-shadow:0 0 0 2px var(--negro) inset; }
.op.on::after { content:"✓"; position:absolute; top:8px; right:10px; width:22px; height:22px; border-radius:50%; background:var(--negro); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; }
.op b { font-size:15.5px; } .op small { color:var(--gris); font-size:13px; } .op .p { font-weight:700; font-size:13.5px; color:var(--naranja-osc); }
.salsa { min-height:150px; justify-content:flex-end; color:#fff; border:0; }
.salsa small { color:rgba(255,255,255,.85); } .salsa b { font-family:var(--f-disp); font-size:22px; }
.salsa.verde { background:linear-gradient(160deg,#6E9F3B,#3F6B1F); } .salsa.roja { background:linear-gradient(160deg,#D9452B,#8F1F12); }
.salsa.mixta { background:linear-gradient(110deg,#4F8A2B 0 50%,#B8321D 50% 100%); }
.salsa.on { box-shadow:0 0 0 3px var(--negro), 0 10px 24px -10px rgba(0,0,0,.5); }
.ico { font-size:26px; line-height:1; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { font:inherit; font-size:15px; font-weight:500; background:var(--papel); border:2px solid var(--linea); border-radius:999px; padding:9px 14px; cursor:pointer; color:inherit; transition:all .15s; }
.chip.on { background:var(--negro); border-color:var(--negro); color:#fff; }
.chip small { color:inherit; opacity:.7; font-weight:400; margin-left:4px; }
.seccion { margin:18px 0 8px; font-weight:700; font-size:14px; color:var(--negro); display:flex; justify-content:space-between; }
.seccion small { color:var(--gris); font-weight:400; }
.cant { display:flex; align-items:center; gap:14px; background:var(--papel); border:2px solid var(--linea); border-radius:16px; padding:10px 14px; }
.cant button { width:40px; height:40px; border-radius:50%; border:0; background:var(--suave); color:var(--naranja-osc); font-size:22px; font-weight:700; cursor:pointer; }
.cant b { font-family:var(--f-disp); font-size:24px; min-width:30px; text-align:center; }
.cant span { flex:1; color:var(--gris); font-size:14px; }
.caja { background:var(--papel); border:1px solid var(--linea); border-radius:16px; padding:14px; display:grid; gap:6px; margin-bottom:10px; }
.caja .tit { display:flex; justify-content:space-between; gap:10px; font-weight:700; }
.caja .det { color:var(--gris); font-size:14px; }
.caja .acc { display:flex; gap:14px; font-size:13.5px; } .caja .acc button { background:none; border:0; padding:0; font:inherit; color:var(--naranja-osc); font-weight:600; cursor:pointer; }
.total { display:flex; justify-content:space-between; font-family:var(--f-disp); font-size:22px; padding:10px 2px; }
input, select, textarea { width:100%; font:inherit; font-size:16px; border:2px solid var(--linea); border-radius:12px; padding:12px; background:var(--papel); color:inherit; }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--naranja); }
label.campo { display:grid; gap:6px; font-weight:700; font-size:14px; margin-bottom:12px; }
.rango { display:flex; align-items:center; gap:12px; } .rango input { flex:1; accent-color:var(--naranja); padding:0; border:0; } .rango b { font-family:var(--f-disp); font-size:26px; min-width:70px; text-align:right; }
.pie { position:fixed; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(to top, var(--crema) 70%, rgba(251,246,239,0)); padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
.pie .in { max-width:448px; margin:0 auto; display:flex; gap:10px; }
.btn { flex:1; min-height:54px; border-radius:999px; border:0; font:700 16.5px var(--f-txt); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
.btn-n { background:var(--naranja); color:var(--negro); box-shadow:0 12px 26px -12px rgba(201,80,12,.8); }
.btn-n:disabled { background:#E7DCCF; color:#9D958B; box-shadow:none; }
.btn-l { flex:0 0 54px; background:var(--papel); border:2px solid var(--linea); color:var(--negro); font-size:20px; }
.btn .t { margin-left:auto; padding-left:8px; opacity:.9; }
.listo { text-align:center; padding-top:30px; }
.listo .ok { width:84px; height:84px; border-radius:50%; background:var(--naranja); display:grid; place-items:center; margin:0 auto 16px; animation:pop .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:none; opacity:1; } }
.nota { font-size:12.5px; color:var(--gris); text-align:center; margin-top:14px; }
.pend { background:#FFF3C4; color:#6B4E00; border-radius:4px; padding:0 4px; font-weight:700; font-size:.85em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="fila"><span class="logo">🌶</span><b id="h-tit">Arma tu cajita</b><small id="h-canal"></small></div>
    <div class="pasos" id="barra"></div>
  </header>
  <main id="main"></main>
  <div class="pie"><div class="in"><button class="btn btn-l" id="atras" aria-label="Atrás">‹</button><button class="btn btn-n" id="sig"><span id="sig-t">Siguiente</span><span class="t" id="sig-total"></span></button></div></div>
</div>
<script>
// ---------- menú (precio de la cajita: el de las apps de entrega; lo demás, de muestra) ----------
var MENU = {
  cajita: { nombre: 'Cajita de chilaquiles (450 g)', precio: 150, incluye: 'frijoles, queso fresco, crema, cebolla morada y cilantro' },
  salsas: [['verde', 'Verdes', 'Los de siempre'], ['roja', 'Rojos', 'Para los que sí aguantan'], ['mixta', 'Mixtos', 'Mitad y mitad']],
  picor: ['Sin picante', 'Normal', 'Que pique 🔥'],
  proteinas: [['Pollo', 0, '🍗'], ['Huevo estrellado', 0, '🍳'], ['Arrachera', 35, '🥩'], ['Chorizo', 20, '🌭'], ['Sin proteína', 0, '🌱']],
  toppings: [['Aguacate', 25], ['Queso extra', 15], ['Chiltepín', 20], ['Doble crema', 10], ['Frijoles extra', 10], ['Totopos extra', 15], ['Salsa aparte', 0], ['Sin cebolla', 0]],
  bebidas: [['Refresco 600 ml', 39, '🥤'], ['Agua', 25, '💧'], ['Café de olla', 35, '☕'], ['Nada', 0, '—']],
  envio: 35,
  sucursales: ['San Pedro', 'San Jerónimo', 'Mitras', 'San Pedro de Pinta', 'Cumbres', 'Centro', 'Venustiano Carranza', 'Tec'],
};
var q = new URLSearchParams(location.search);
var CANAL = { wa: 'WhatsApp', ig: 'Instagram', fb: 'Messenger' }[q.get('canal')] || '';
var EVENTO = q.get('modo') === 'evento';
var DENTRO = window.parent !== window;
var $ = function (s) { return document.querySelector(s); };
var dinero = function (n) { return '$' + Math.round(n).toLocaleString('es-MX'); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
$('#h-canal').textContent = CANAL ? 'dentro de ' + CANAL : '';

// ---------- estado ----------
var nueva = function () { return { salsa: null, picor: 'Normal', proteina: null, toppings: [], bebida: null, cant: 1 }; };
var st = { paso: 0, actual: nueva(), carrito: [], entrega: null, sucursal: 'San Pedro', direccion: '', pago: null, nombre: '',
  ev: { tipo: null, fecha: '', hora: '10:00', personas: 60, salsas: ['verde', 'roja'], proteinas: ['Pollo'], toppings: [], lugar: '', nombre: '' } };
var precioCajita = function (c) {
  var p = MENU.cajita.precio + (MENU.proteinas.find(function (x) { return x[0] === c.proteina; }) || [0, 0])[1];
  c.toppings.forEach(function (t) { p += (MENU.toppings.find(function (x) { return x[0] === t; }) || [0, 0])[1]; });
  p += (MENU.bebidas.find(function (x) { return x[0] === c.bebida; }) || [0, 0])[1];
  return p * c.cant;
};
var subtotal = function () { return st.carrito.reduce(function (s, c) { return s + precioCajita(c); }, 0); };
var total = function () { return subtotal() + (st.entrega === 'domicilio' ? MENU.envio : 0); };
var nomSalsa = function (k) { return (MENU.salsas.find(function (s) { return s[0] === k; }) || [0, k])[1]; };
var resumenCajita = function (c) {
  return c.cant + ' × ' + nomSalsa(c.salsa) + (c.picor !== 'Normal' ? ' (' + c.picor.replace(' 🔥', '') + ')' : '') + ' con ' + (c.proteina || '').toLowerCase() +
    (c.toppings.length ? ' + ' + c.toppings.join(', ').toLowerCase() : '') + (c.bebida && c.bebida !== 'Nada' ? ' · ' + c.bebida.toLowerCase() : '');
};

// ---------- pasos ----------
var PEDIDO = [
  { t: '¿Qué salsa?', listo: function () { return !!st.actual.salsa; }, html: function () {
    return '<h1>¿Qué salsa?</h1><p class="ayuda">Tu cajita de 450 g ya trae ' + MENU.cajita.incluye + '.</p><div class="grid g3">' +
      MENU.salsas.map(function (s) { return '<button class="op salsa ' + s[0] + (st.actual.salsa === s[0] ? ' on' : '') + '" data-salsa="' + s[0] + '"><b>' + s[1] + '</b><small>' + s[2] + '</small></button>'; }).join('') +
      '</div><div class="seccion">¿Qué tanto pica?</div><div class="chips">' +
      MENU.picor.map(function (p) { return '<button class="chip' + (st.actual.picor === p ? ' on' : '') + '" data-picor="' + p + '">' + p + '</button>'; }).join('') + '</div>'; } },
  { t: 'Proteína', listo: function () { return !!st.actual.proteina; }, html: function () {
    return '<h1>¿Con qué la quieres?</h1><p class="ayuda">Escoge una proteína.</p><div class="grid g2">' +
      MENU.proteinas.map(function (p) { return '<button class="op' + (st.actual.proteina === p[0] ? ' on' : '') + '" data-prot="' + p[0] + '"><span class="ico">' + p[2] + '</span><b>' + p[0] + '</b><span class="p">' + (p[1] ? '+' + dinero(p[1]) : 'Incluido') + '</span></button>'; }).join('') + '</div>'; } },
  { t: 'Toppings', listo: function () { return true; }, html: function () {
    return '<h1>Ponle lo que quieras</h1><p class="ayuda">Toca todos los que se te antojen. Lista de toppings <span class="pend">por confirmar</span>.</p><div class="chips">' +
      MENU.toppings.map(function (t) { return '<button class="chip' + (st.actual.toppings.indexOf(t[0]) >= 0 ? ' on' : '') + '" data-top="' + t[0] + '">' + t[0] + (t[1] ? '<small>+' + dinero(t[1]) + '</small>' : '') + '</button>'; }).join('') + '</div>'; } },
  { t: 'Bebida', listo: function () { return !!st.actual.bebida; }, html: function () {
    return '<h1>¿Algo de tomar?</h1><p class="ayuda">Para acompañar.</p><div class="grid g2">' +
      MENU.bebidas.map(function (b) { return '<button class="op' + (st.actual.bebida === b[0] ? ' on' : '') + '" data-beb="' + b[0] + '"><span class="ico">' + b[2] + '</span><b>' + b[0] + '</b><span class="p">' + (b[1] ? dinero(b[1]) : '') + '</span></button>'; }).join('') +
      '</div><div class="seccion">¿Cuántas cajitas así?</div><div class="cant"><button data-cant="-1">−</button><b>' + st.actual.cant + '</b><button data-cant="1">+</button><span>' + dinero(precioCajita(st.actual)) + '</span></div>'; } },
  { t: 'Tu pedido', listo: function () { return st.carrito.length > 0; }, al: function () { if (st.actual.salsa) { st.carrito.push(st.actual); st.actual = nueva(); } }, html: function () {
    return '<h1>Tu pedido</h1><p class="ayuda">¿Alguien más va a querer? Agrégale otra cajita.</p>' +
      st.carrito.map(function (c, i) { return '<div class="caja"><div class="tit"><span>' + c.cant + ' × Cajita ' + nomSalsa(c.salsa).toLowerCase() + '</span><span>' + dinero(precioCajita(c)) + '</span></div><div class="det">' + esc(resumenCajita(c).replace(/^\d+ × /, '')) + '</div><div class="acc"><button data-quitar="' + i + '">Quitar</button></div></div>'; }).join('') +
      '<button class="op" data-otra style="align-items:center;flex-direction:row;justify-content:center;border-style:dashed"><b>+ Agregar otra cajita</b></button>' +
      '<div class="total"><span>Subtotal</span><span>' + dinero(subtotal()) + '</span></div>'; } },
  { t: 'Entrega', listo: function () { return st.entrega === 'recoger' || (st.entrega === 'domicilio' && st.direccion.trim().length > 5); }, html: function () {
    return '<h1>¿Cómo te lo damos?</h1><p class="ayuda">A domicilio te llega con uno de nuestros choferes.</p><div class="grid g2">' +
      '<button class="op' + (st.entrega === 'domicilio' ? ' on' : '') + '" data-ent="domicilio"><span class="ico">🛵</span><b>A domicilio</b><span class="p">+' + dinero(MENU.envio) + '</span></button>' +
      '<button class="op' + (st.entrega === 'recoger' ? ' on' : '') + '" data-ent="recoger"><span class="ico">🏪</span><b>Paso por él</b><span class="p">Sin costo</span></button></div>' +
      (st.entrega === 'domicilio' ? '<div style="margin-top:14px"><label class="campo">Dirección<input id="dir" value="' + esc(st.direccion) + '" placeholder="Calle, número y colonia" autocomplete="street-address"></label></div>' : '') +
      (st.entrega === 'recoger' ? '<div style="margin-top:14px"><label class="campo">¿En qué sucursal?<select id="suc">' + MENU.sucursales.map(function (s) { return '<option' + (s === st.sucursal ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></label></div>' : ''); } },
  { t: 'Pago', listo: function () { return !!st.pago; }, html: function () {
    return '<h1>¿Cómo pagas?</h1><p class="ayuda">Total: <b>' + dinero(total()) + '</b>' + (st.entrega === 'domicilio' ? ' (con envío)' : '') + '</p><div class="grid g2">' +
      '<button class="op' + (st.pago === 'Efectivo' ? ' on' : '') + '" data-pago="Efectivo"><span class="ico">💵</span><b>Efectivo</b><small>Al recibir</small></button>' +
      '<button class="op' + (st.pago === 'Transferencia' ? ' on' : '') + '" data-pago="Transferencia"><span class="ico">🏦</span><b>Transferencia</b><small>Te pasamos los datos</small></button></div>' +
      (st.pago === 'Efectivo' ? '<div class="seccion" style="margin-top:16px">¿Con cuánto pagas? <small>para llevarte cambio</small></div><div class="chips">' + ['Exacto', '$200', '$500', '$1,000'].map(function (x) { return '<button class="chip' + (st.cambio === x ? ' on' : '') + '" data-cambio="' + x + '">' + x + '</button>'; }).join('') + '</div>' : ''); } },
];
var EVENTOS = [
  { t: 'Tu evento', listo: function () { return !!st.ev.tipo; }, html: function () {
    return '<h1>¿Qué vas a celebrar?</h1><p class="ayuda">En 1 minuto te damos una cotización.</p><div class="grid g2">' +
      [['Cumpleaños', '🎂'], ['Boda o XV', '💍'], ['Desayuno de oficina', '💼'], ['Reunión', '🙌'], ['Tornafiesta', '🌙'], ['Otro', '✨']].map(function (x) { return '<button class="op' + (st.ev.tipo === x[0] ? ' on' : '') + '" data-ev-tipo="' + x[0] + '"><span class="ico">' + x[1] + '</span><b>' + x[0] + '</b></button>'; }).join('') + '</div>'; } },
  { t: 'Cuándo y cuántos', listo: function () { return !!st.ev.fecha; }, html: function () {
    var min = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
    return '<h1>¿Cuándo y cuántos?</h1><p class="ayuda">Aproximado está bien.</p><label class="campo">Fecha<input type="date" id="ev-fecha" min="' + min + '" value="' + esc(st.ev.fecha) + '"></label><label class="campo">Hora<input type="time" id="ev-hora" value="' + esc(st.ev.hora) + '"></label>' +
      '<div class="seccion">Personas</div><div class="rango"><input type="range" id="ev-pers" min="15" max="500" step="5" value="' + st.ev.personas + '"><b id="ev-pers-n">' + st.ev.personas + '</b></div>'; } },
  { t: 'Tu barra', listo: function () { return st.ev.salsas.length > 0 && st.ev.proteinas.length > 0; }, html: function () {
    return '<h1>Arma tu barra</h1><p class="ayuda">Escoge todas las que quieras: cada invitado se sirve su cajita.</p><div class="seccion">Salsas</div><div class="chips">' +
      MENU.salsas.map(function (s) { return '<button class="chip' + (st.ev.salsas.indexOf(s[0]) >= 0 ? ' on' : '') + '" data-ev-salsa="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div><div class="seccion">Proteínas</div><div class="chips">' +
      MENU.proteinas.slice(0, 4).map(function (p) { return '<button class="chip' + (st.ev.proteinas.indexOf(p[0]) >= 0 ? ' on' : '') + '" data-ev-prot="' + p[0] + '">' + p[2] + ' ' + p[0] + '</button>'; }).join('') + '</div><div class="seccion">Toppings</div><div class="chips">' +
      MENU.toppings.slice(0, 6).map(function (t) { return '<button class="chip' + (st.ev.toppings.indexOf(t[0]) >= 0 ? ' on' : '') + '" data-ev-top="' + t[0] + '">' + t[0] + '</button>'; }).join('') + '</div>'; } },
  { t: 'Dónde', listo: function () { return st.ev.lugar.trim().length > 3; }, html: function () {
    return '<h1>¿Dónde es?</h1><p class="ayuda">Colonia, salón o dirección.</p><label class="campo">Lugar<input id="ev-lugar" value="' + esc(st.ev.lugar) + '" placeholder="Ej. Quinta Los Encinos, Santiago"></label>' +
      '<div class="caja"><div class="tit"><span>Tu cotización estimada</span></div><div class="det">' + esc(st.ev.tipo) + ' · ' + st.ev.personas + ' personas · ' + st.ev.salsas.map(nomSalsa).join(' y ').toLowerCase() + ' · ' + esc(st.ev.proteinas.join(', ').toLowerCase()) + '</div>' +
      '<div class="total" style="padding:4px 0 0"><span>Por persona</span><span>$<span class="pend">__</span></span></div><div class="det">El precio final te lo confirma Chilabike por este chat. Para apartar la fecha se pide anticipo.</div></div>'; } },
];
var PASOS = EVENTO ? EVENTOS : PEDIDO;
$('#h-tit').textContent = EVENTO ? 'Cotiza tu evento' : 'Arma tu cajita';

var ultimoPaso = -1;
function pintar() {
  var p = PASOS[st.paso], anim = ultimoPaso !== st.paso; ultimoPaso = st.paso;
  $('#barra').innerHTML = PASOS.map(function (_, i) { return '<i class="' + (i <= st.paso ? 'on' : '') + '"></i>'; }).join('');
  $('#main').innerHTML = '<section class="paso on' + (anim ? ' anim' : '') + '">' + p.html() + '</section>';
  var ultimo = st.paso === PASOS.length - 1;
  $('#sig-t').textContent = ultimo ? (EVENTO ? 'Enviar a Chilabike' : 'Hacer mi pedido') : st.paso === 3 && !EVENTO ? 'Agregar al pedido' : 'Siguiente';
  $('#sig-total').textContent = EVENTO ? '' : (st.paso <= 3 ? dinero(subtotal() + (st.actual.salsa ? precioCajita(st.actual) : 0)) : dinero(total()));
  $('#sig').disabled = !p.listo();
  $('#atras').style.visibility = st.paso === 0 ? 'hidden' : 'visible';
  enlazar();
}
function toggle(lista, v) { var i = lista.indexOf(v); if (i >= 0) lista.splice(i, 1); else lista.push(v); }
function enlazar() {
  var A = st.actual;
  document.querySelectorAll('[data-salsa]').forEach(function (b) { b.onclick = function () { A.salsa = b.dataset.salsa; pintar(); }; });
  document.querySelectorAll('[data-picor]').forEach(function (b) { b.onclick = function () { A.picor = b.dataset.picor; pintar(); }; });
  document.querySelectorAll('[data-prot]').forEach(function (b) { b.onclick = function () { A.proteina = b.dataset.prot; pintar(); setTimeout(avanzar, 260); }; });
  document.querySelectorAll('[data-top]').forEach(function (b) { b.onclick = function () { toggle(A.toppings, b.dataset.top); pintar(); }; });
  document.querySelectorAll('[data-beb]').forEach(function (b) { b.onclick = function () { A.bebida = b.dataset.beb; pintar(); }; });
  document.querySelectorAll('[data-cant]').forEach(function (b) { b.onclick = function () { A.cant = Math.max(1, A.cant + Number(b.dataset.cant)); pintar(); }; });
  document.querySelectorAll('[data-quitar]').forEach(function (b) { b.onclick = function () { st.carrito.splice(Number(b.dataset.quitar), 1); pintar(); }; });
  var otra = $('[data-otra]'); if (otra) otra.onclick = function () { st.paso = 0; pintar(); };
  document.querySelectorAll('[data-ent]').forEach(function (b) { b.onclick = function () { st.entrega = b.dataset.ent; pintar(); var d = $('#dir'); if (d) d.focus(); }; });
  var dir = $('#dir'); if (dir) dir.oninput = function () { st.direccion = dir.value; $('#sig').disabled = !PASOS[st.paso].listo(); };
  var suc = $('#suc'); if (suc) suc.onchange = function () { st.sucursal = suc.value; };
  document.querySelectorAll('[data-pago]').forEach(function (b) { b.onclick = function () { st.pago = b.dataset.pago; pintar(); }; });
  document.querySelectorAll('[data-cambio]').forEach(function (b) { b.onclick = function () { st.cambio = b.dataset.cambio; pintar(); }; });
  var E = st.ev;
  document.querySelectorAll('[data-ev-tipo]').forEach(function (b) { b.onclick = function () { E.tipo = b.dataset.evTipo; pintar(); setTimeout(avanzar, 260); }; });
  var f = $('#ev-fecha'); if (f) f.oninput = function () { E.fecha = f.value; $('#sig').disabled = !PASOS[st.paso].listo(); };
  var h = $('#ev-hora'); if (h) h.oninput = function () { E.hora = h.value; };
  var pr = $('#ev-pers'); if (pr) pr.oninput = function () { E.personas = Number(pr.value); $('#ev-pers-n').textContent = pr.value; };
  document.querySelectorAll('[data-ev-salsa]').forEach(function (b) { b.onclick = function () { toggle(E.salsas, b.dataset.evSalsa); pintar(); }; });
  document.querySelectorAll('[data-ev-prot]').forEach(function (b) { b.onclick = function () { toggle(E.proteinas, b.dataset.evProt); pintar(); }; });
  document.querySelectorAll('[data-ev-top]').forEach(function (b) { b.onclick = function () { toggle(E.toppings, b.dataset.evTop); pintar(); }; });
  var l = $('#ev-lugar'); if (l) l.oninput = function () { E.lugar = l.value; $('#sig').disabled = !PASOS[st.paso].listo(); };
}
function avanzar() {
  var p = PASOS[st.paso]; if (!p.listo()) return;
  if (st.paso === PASOS.length - 1) return terminar();
  st.paso++; if (PASOS[st.paso].al) PASOS[st.paso].al(); pintar(); window.scrollTo(0, 0);
}
$('#sig').onclick = avanzar;
$('#atras').onclick = function () {
  if (st.paso === 0) return;
  if (!EVENTO && st.paso === 4 && st.carrito.length) { st.actual = st.carrito.pop(); }
  st.paso--; pintar();
};

function terminar() {
  var pedido;
  if (EVENTO) {
    var E = st.ev;
    pedido = { tipo: 'evento', canal: CANAL || 'Página', creado_en: new Date().toISOString(),
      texto: '🎉 Quiero cotizar un evento\n' + E.tipo + ' · ' + E.personas + ' personas\n📅 ' + fechaBonita(E.fecha) + ', ' + E.hora + '\n📍 ' + E.lugar +
        '\n🌶️ Barra: ' + E.salsas.map(nomSalsa).join(' y ') + ' con ' + E.proteinas.join(', ').toLowerCase() + (E.toppings.length ? '\n➕ ' + E.toppings.join(', ').toLowerCase() : ''),
      evento: { tipo: E.tipo, fecha: E.fecha, hora: E.hora, personas: E.personas, direccion: E.lugar, paquete: E.tipo === 'Desayuno de oficina' ? 'Desayuno de oficina' : E.tipo === 'Tornafiesta' || E.tipo === 'Boda o XV' ? 'Tornafiesta' : 'Fiesta',
        notas: 'Barra: ' + E.salsas.map(nomSalsa).join(' y ') + ' · ' + E.proteinas.join(', ') + (E.toppings.length ? ' · toppings: ' + E.toppings.join(', ') : '') } };
  } else {
    pedido = { tipo: 'pedido', canal: CANAL || 'Página', creado_en: new Date().toISOString(), total: total(), pago: st.pago,
      texto: '🛒 Mi pedido\n' + st.carrito.map(function (c) { return '• ' + resumenCajita(c); }).join('\n') +
        '\n' + (st.entrega === 'domicilio' ? '🛵 A domicilio: ' + st.direccion : '🏪 Paso por él a ' + st.sucursal) +
        '\n💳 ' + st.pago + (st.cambio && st.pago === 'Efectivo' ? ' (pago con ' + st.cambio + ')' : '') + '\nTotal: ' + dinero(total()) };
  }
  if (DENTRO) { window.parent.postMessage({ chilabike: true, pedido: pedido }, '*'); }
  try { var l = JSON.parse(localStorage.getItem('chilabike-demo-pedidos') || '[]'); l.push(pedido); localStorage.setItem('chilabike-demo-pedidos', JSON.stringify(l)); } catch (e) {}
  $('#barra').innerHTML = PASOS.map(function () { return '<i class="on"></i>'; }).join('');
  $('#main').innerHTML = '<div class="listo"><div class="ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#121110" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>' +
    '<h1>' + (EVENTO ? '¡Ya llegó tu solicitud!' : '¡Pedido enviado!') + '</h1><p class="ayuda">' + (CANAL ? 'Regresa al chat de ' + CANAL + ': ahí te confirmamos' : 'Te confirmamos por WhatsApp') + (EVENTO ? ' tu cotización.' : ' y te avisamos cuando salga tu pedido.') + '</p>' +
    '<div class="caja" style="text-align:left;white-space:pre-line">' + esc(pedido.texto) + '</div>' +
    (DENTRO ? '' : '<p class="nota">Demo: el pedido aparece en Mensajes del portal (unaria.mx/demo/?demo=chilabike) si lo abres en este navegador.</p>') + '</div>';
  document.querySelector('.pie').style.display = 'none';
}
function fechaBonita(iso) { if (!iso) return ''; var t = new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); }
pintar();
</script>
