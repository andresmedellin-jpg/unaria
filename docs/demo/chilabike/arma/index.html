<!doctype html>
<!-- Menú interactivo de Chilabike ("Arma tu cajita"): se abre desde WhatsApp, Instagram o Messenger.
     Se arma SOLO con el menú capturado en el portal (Chilabike → Menú): producto, pasos (salsa, picor, proteína,
     toppings, bebida… los que haya) con sus opciones, precios y "agotado hoy"; luego carrito, entrega y pago.
     ?modo=evento cotiza un evento con las mismas salsas, proteínas y toppings. ?canal=wa|ig|fb dice desde qué app se abrió.
     Origen del menú: CONFIG.menuUrl (producción) → el que se editó en el portal del demo (localStorage) → menu-ejemplo.js.
     Al terminar: dentro del simulador avisa con postMessage; además guarda el pedido (demo: localStorage; producción: CONFIG.pedidoUrl). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arma tu cajita · Chilabike</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121110">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root { --negro:#121110; --crema:#FBF6EF; --papel:#fff; --linea:#E9E1D6; --naranja:#F26B1D; --naranja-osc:#C9500C; --suave:#FDE8DA; --texto:#2B2724; --gris:#6E6760;
  --f-disp:'Bricolage Grotesque','Arial Black',Arial,sans-serif; --f-txt:'DM Sans',Arial,sans-serif; color-scheme:light; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { background:var(--crema); color:var(--texto); font:400 16px/1.45 var(--f-txt); -webkit-font-smoothing:antialiased; }
.app { max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--crema); }
header { position:sticky; top:0; z-index:5; background:var(--negro); color:#fff; padding:12px 16px 10px; }
header .fila { display:flex; align-items:center; gap:10px; }
header .logo { width:30px; height:30px; border-radius:50%; background:var(--naranja); display:grid; place-items:center; font-size:14px; }
header b { font-family:var(--f-disp); font-size:18px; letter-spacing:-.01em; }
header small { margin-left:auto; color:#BDB4A9; font-size:12px; }
.pasos { display:flex; gap:4px; margin-top:10px; }
.pasos i { flex:1; height:4px; border-radius:2px; background:#3A3633; transition:background .3s; }
.pasos i.on { background:var(--naranja); }
main { flex:1; padding:18px 16px 120px; }
.paso.anim { animation:entra .3s ease both; }
@keyframes entra { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
h1 { font-family:var(--f-disp); font-size:28px; line-height:1.05; letter-spacing:-.02em; margin:0 0 4px; color:var(--negro); }
.ayuda { color:var(--gris); font-size:14.5px; margin:0 0 16px; }
.grid { display:grid; gap:10px; }
.g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.op { position:relative; display:flex; flex-direction:column; gap:4px; text-align:left; font:inherit; color:inherit; background:var(--papel); border:2px solid var(--linea); border-radius:16px; padding:12px; cursor:pointer; transition:transform .12s, border-color .15s, box-shadow .15s; min-height:64px; }
.op:active { transform:scale(.97); }
.op.on { border-color:var(--negro); box-shadow:0 0 0 2px var(--negro) inset; }
.op.on::after { content:"✓"; position:absolute; top:8px; right:10px; width:22px; height:22px; border-radius:50%; background:var(--negro); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; }
.op b { font-size:15.5px; } .op small { color:var(--gris); font-size:13px; } .op .p { font-weight:700; font-size:13.5px; color:var(--naranja-osc); }
.op.agotado, .chip.agotado { opacity:.45; cursor:not-allowed; } .op.agotado .p::after { content:" · agotado"; }
.salsa { min-height:150px; justify-content:flex-end; color:#fff; border:0; }
.salsa small { color:rgba(255,255,255,.85); } .salsa b { font-family:var(--f-disp); font-size:22px; }
.salsa.on { box-shadow:0 0 0 3px var(--negro), 0 10px 24px -10px rgba(0,0,0,.5); }
.ico { font-size:26px; line-height:1; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { font:inherit; font-size:15px; font-weight:500; background:var(--papel); border:2px solid var(--linea); border-radius:999px; padding:9px 14px; cursor:pointer; color:inherit; transition:all .15s; }
.chip.on { background:var(--negro); border-color:var(--negro); color:#fff; }
.chip small { color:inherit; opacity:.7; font-weight:400; margin-left:4px; }
.seccion { margin:18px 0 8px; font-weight:700; font-size:14px; color:var(--negro); display:flex; justify-content:space-between; }
.seccion small { color:var(--gris); font-weight:400; }
.cant { display:flex; align-items:center; gap:14px; background:var(--papel); border:2px solid var(--linea); border-radius:16px; padding:10px 14px; }
.cant button { width:40px; height:40px; border-radius:50%; border:0; background:var(--suave); color:var(--naranja-osc); font-size:22px; font-weight:700; cursor:pointer; }
.cant b { font-family:var(--f-disp); font-size:24px; min-width:30px; text-align:center; }
.cant span { flex:1; color:var(--gris); font-size:14px; }
.caja { background:var(--papel); border:1px solid var(--linea); border-radius:16px; padding:14px; display:grid; gap:6px; margin-bottom:10px; }
.caja .tit { display:flex; justify-content:space-between; gap:10px; font-weight:700; }
.caja .det { color:var(--gris); font-size:14px; }
.caja .acc { display:flex; gap:14px; font-size:13.5px; } .caja .acc button { background:none; border:0; padding:0; font:inherit; color:var(--naranja-osc); font-weight:600; cursor:pointer; }
.total { display:flex; justify-content:space-between; font-family:var(--f-disp); font-size:22px; padding:10px 2px; }
input, select, textarea { width:100%; font:inherit; font-size:16px; border:2px solid var(--linea); border-radius:12px; padding:12px; background:var(--papel); color:inherit; }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--naranja); }
label.campo { display:grid; gap:6px; font-weight:700; font-size:14px; margin-bottom:12px; }
.rango { display:flex; align-items:center; gap:12px; } .rango input { flex:1; accent-color:var(--naranja); padding:0; border:0; } .rango b { font-family:var(--f-disp); font-size:26px; min-width:70px; text-align:right; }
.pie { position:fixed; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(to top, var(--crema) 70%, rgba(251,246,239,0)); padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
.pie .in { max-width:448px; margin:0 auto; display:flex; gap:10px; }
.btn { flex:1; min-height:54px; border-radius:999px; border:0; font:700 16.5px var(--f-txt); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
.btn-n { background:var(--naranja); color:var(--negro); box-shadow:0 12px 26px -12px rgba(201,80,12,.8); }
.btn-n:disabled { background:#E7DCCF; color:#9D958B; box-shadow:none; }
.btn-l { flex:0 0 54px; background:var(--papel); border:2px solid var(--linea); color:var(--negro); font-size:20px; }
.btn .t { margin-left:auto; padding-left:8px; opacity:.9; }
.listo { text-align:center; padding-top:30px; }
.listo .ok { width:84px; height:84px; border-radius:50%; background:var(--naranja); display:grid; place-items:center; margin:0 auto 16px; animation:pop .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:none; opacity:1; } }
.nota { font-size:12.5px; color:var(--gris); text-align:center; margin-top:14px; }
.incl { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.incl li { display:flex; gap:12px; align-items:flex-start; background:var(--papel); border:1px solid var(--linea); border-radius:14px; padding:10px 12px; font-size:14px; color:var(--gris); }
.incl li span { font-size:22px; line-height:1.1; } .incl li b { display:block; color:var(--negro); font-size:15px; }
.caja.ant { background:var(--suave); border-color:#F7C9A9; } .caja.ant .det { color:#7A3D12; }
.cant small { font-size:12.5px; }
.pend { background:#FFF3C4; color:#6B4E00; border-radius:4px; padding:0 4px; font-weight:700; font-size:.85em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="fila"><span class="logo">🌶</span><b id="h-tit">Arma tu cajita</b><small id="h-canal"></small></div>
    <div class="pasos" id="barra"></div>
  </header>
  <main id="main"><p class="ayuda">Cargando el menú…</p></main>
  <div class="pie"><div class="in"><button class="btn btn-l" id="atras" aria-label="Atrás">‹</button><button class="btn btn-n" id="sig"><span id="sig-t">Siguiente</span><span class="t" id="sig-total"></span></button></div></div>
</div>
<script src="../menu-ejemplo.js?v=20261104-1930"></script>
<script>
// ---------- configuración (producción: la función de Supabase de Chilabike) ----------
var CONFIG = {
  menuUrl: '',      // GET → el menú publicado (tabla app.menus)
  pedidoUrl: '',    // POST → crea el pedido (tabla app.pedidos) y lo liga a la conversación
};
var q = new URLSearchParams(location.search);
var CANAL = { wa: 'WhatsApp', ig: 'Instagram', fb: 'Messenger' }[q.get('canal')] || '';
var EVENTO = q.get('modo') === 'evento';
var CONV = q.get('c') || null;               // la conversación de la que salió (va firmada en producción)
var DENTRO = window.parent !== window;
var $ = function (s) { return document.querySelector(s); };
var dinero = function (n) { return '$' + Math.round(n).toLocaleString('es-MX'); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
$('#h-canal').textContent = CANAL ? 'dentro de ' + CANAL : '';
var M, PASOS, st;

function cargarMenu() {
  if (CONFIG.menuUrl) return fetch(CONFIG.menuUrl).then(function (r) { return r.json(); });
  var guardado = null; try { guardado = JSON.parse(localStorage.getItem('chilabike-demo-menu') || 'null'); } catch (e) {}
  return Promise.resolve(guardado || window.MENU_CHILABIKE);
}
cargarMenu().then(function (m) { M = m; if (!(M.eventos || {}).horarios && window.MENU_CHILABIKE) M.eventos = Object.assign({}, window.MENU_CHILABIKE.eventos, M.eventos || {}, { horarios: window.MENU_CHILABIKE.eventos.horarios, incluye: window.MENU_CHILABIKE.eventos.incluye }); iniciar(); }).catch(function () { $('#main').innerHTML = '<p class="ayuda">No se pudo cargar el menú. Intenta de nuevo en un momento.</p>'; });

// ---------- ayudantes del menú ----------
var paso = function (id) { return M.pasos.find(function (p) { return p.id === id; }); };
var opcion = function (pid, oid) { var p = paso(pid); return p && p.opciones.find(function (o) { return o.id === oid; }); };
var visibles = function (p) { return p.opciones.filter(function (o) { return o.visible !== false; }); };
function nueva() {
  var e = {}; M.pasos.forEach(function (p) { e[p.id] = p.tipo === 'varias' ? [] : (p.predeterminado || null); });
  return { e: e, cant: 1 };
}
function precioUnit(c) {
  var t = Number(M.producto.precio || 0);
  M.pasos.forEach(function (p) { [].concat(c.e[p.id] || []).forEach(function (oid) { var o = opcion(p.id, oid); if (o) t += Number(o.precio || 0); }); });
  return t;
}
var precioCajita = function (c) { return precioUnit(c) * c.cant; };
var subtotal = function () { return st.carrito.reduce(function (s, c) { return s + precioCajita(c); }, 0); };
var envio = function () { return st.entrega === 'domicilio' ? Number(M.envio || 0) : 0; };
var total = function () { return subtotal() + envio(); };
function resumen(c) {
  var partes = [];
  M.pasos.forEach(function (p) {
    var ids = [].concat(c.e[p.id] || []);
    if (!ids.length || (p.predeterminado && ids.length === 1 && ids[0] === p.predeterminado)) return;
    var n = ids.map(function (oid) { return (opcion(p.id, oid) || {}).nombre; }).filter(function (x) { return x && !/^nada$/i.test(x); });
    if (n.length) partes.push(n.join(', '));
  });
  return partes.join(' · ');
}

// ---------- pasos: los del menú (los "junto" van en la misma pantalla que el anterior) + carrito, entrega y pago ----------
function iniciar() {
  document.title = (EVENTO ? 'Cotiza tu evento' : 'Arma tu ' + M.producto.nombre.split(' ')[0].toLowerCase()) + ' · ' + M.negocio;
  $('#h-tit').textContent = EVENTO ? 'Cotiza tu evento' : 'Arma tu ' + M.producto.nombre.split(' ')[0].toLowerCase();
  st = { paso: 0, actual: nueva(), carrito: [], entrega: null, sucursal: M.sucursales[0], direccion: '', pago: null, cambio: null,
    ev: { tipo: null, fecha: '', horario: null, hora: '', personas: 0, lugar: '', factura: null } };
  if (EVENTO) { PASOS = EVENTOS.filter(function (p) { return !p.siFactura || EV().pideFactura; }); } else {
    PASOS = [];
    M.pasos.forEach(function (p) { if (p.junto && PASOS.length) PASOS[PASOS.length - 1].ids.push(p.id); else PASOS.push({ ids: [p.id] }); });
    PASOS = PASOS.map(pasoMenu).concat([CARRITO, ENTREGA, PAGO]);
  }
  pintar();
}
function bloque(p, i) {
  var A = st.actual, sel = function (o) { return [].concat(A.e[p.id] || []).indexOf(o.id) >= 0; };
  var cab = i === 0 ? '<h1>' + esc(p.titulo) + '</h1>' + (p.ayuda ? '<p class="ayuda">' + esc(p.ayuda) + '</p>' : '<p class="ayuda"></p>') : '<div class="seccion">' + esc(p.titulo) + (p.tipo === 'varias' ? '<small>las que quieras</small>' : '') + '</div>';
  var ops = visibles(p);
  if (p.estilo === 'salsa') return cab + '<div class="grid g3">' + ops.map(function (o) {
    return '<button class="op salsa' + (sel(o) ? ' on' : '') + (o.disponible === false ? ' agotado' : '') + '" style="background:' + (o.color || 'var(--negro)') + '" data-p="' + p.id + '" data-o="' + o.id + '"><b>' + esc(o.nombre) + '</b><small>' + esc(o.disponible === false ? 'Agotado hoy' : o.desc || '') + '</small></button>'; }).join('') + '</div>';
  if (p.estilo === 'tarjeta') return cab + '<div class="grid g2">' + ops.map(function (o) {
    return '<button class="op' + (sel(o) ? ' on' : '') + (o.disponible === false ? ' agotado' : '') + '" data-p="' + p.id + '" data-o="' + o.id + '">' + (o.emoji ? '<span class="ico">' + o.emoji + '</span>' : '') + '<b>' + esc(o.nombre) + '</b><span class="p">' + (o.disponible === false ? 'Agotado hoy' : o.precio ? (p.id === 'bebida' ? dinero(o.precio) : '+' + dinero(o.precio)) : i === 0 && p.id !== 'bebida' ? 'Incluido' : '') + '</span></button>'; }).join('') + '</div>';
  return cab + '<div class="chips">' + ops.map(function (o) {
    return '<button class="chip' + (sel(o) ? ' on' : '') + (o.disponible === false ? ' agotado' : '') + '" data-p="' + p.id + '" data-o="' + o.id + '">' + esc(o.nombre) + (o.disponible === false ? '<small>agotado</small>' : o.precio ? '<small>+' + dinero(o.precio) + '</small>' : '') + '</button>'; }).join('') + '</div>';
}
function pasoMenu(g) {
  var ps = g.ids.map(paso), ultimoMenu = g.ids.indexOf(M.pasos[M.pasos.length - 1].id) >= 0;
  return { menu: true, ultimoMenu: ultimoMenu, auto: ps.length === 1 && ps[0].tipo === 'una' && ps[0].estilo !== 'salsa' && !ultimoMenu,
    listo: function () { return ps.every(function (p) { return !p.obligatorio || [].concat(st.actual.e[p.id] || []).length > 0; }); },
    html: function () {
      return ps.map(bloque).join('') + (ultimoMenu ? '<div class="seccion">¿Cuántas así?</div><div class="cant"><button data-cant="-1">−</button><b>' + st.actual.cant + '</b><button data-cant="1">+</button><span>' + dinero(precioCajita(st.actual)) + '</span></div>' : '');
    } };
}
var CARRITO = { carrito: true, listo: function () { return st.carrito.length > 0; }, al: function () { if (pasoListo(st.actual)) { st.carrito.push(st.actual); st.actual = nueva(); } }, html: function () {
  return '<h1>Tu pedido</h1><p class="ayuda">¿Alguien más va a querer? Agrégale otra.</p>' +
    st.carrito.map(function (c, i) { return '<div class="caja"><div class="tit"><span>' + c.cant + ' × ' + esc(M.producto.nombre) + '</span><span>' + dinero(precioCajita(c)) + '</span></div><div class="det">' + esc(resumen(c)) + '</div><div class="acc"><button data-quitar="' + i + '">Quitar</button></div></div>'; }).join('') +
    '<button class="op" data-otra style="align-items:center;flex-direction:row;justify-content:center;border-style:dashed"><b>+ Agregar otra</b></button>' +
    '<div class="total"><span>Subtotal</span><span>' + dinero(subtotal()) + '</span></div>'; } };
var ENTREGA = { listo: function () { return st.entrega === 'recoger' || (st.entrega === 'domicilio' && st.direccion.trim().length > 5); }, html: function () {
  return '<h1>¿Cómo te lo damos?</h1><p class="ayuda">A domicilio te llega con uno de nuestros choferes.</p><div class="grid g2">' +
    '<button class="op' + (st.entrega === 'domicilio' ? ' on' : '') + '" data-ent="domicilio"><span class="ico">🛵</span><b>A domicilio</b><span class="p">' + (M.envio ? '+' + dinero(M.envio) : 'Sin costo') + '</span></button>' +
    '<button class="op' + (st.entrega === 'recoger' ? ' on' : '') + '" data-ent="recoger"><span class="ico">🏪</span><b>Paso por él</b><span class="p">Sin costo</span></button></div>' +
    (st.entrega === 'domicilio' ? '<div style="margin-top:14px"><label class="campo">Dirección<input id="dir" value="' + esc(st.direccion) + '" placeholder="Calle, número y colonia" autocomplete="street-address"></label></div>' : '') +
    (st.entrega === 'recoger' ? '<div style="margin-top:14px"><label class="campo">¿En qué sucursal?<select id="suc">' + M.sucursales.map(function (s) { return '<option' + (s === st.sucursal ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></label></div>' : ''); } };
var PAGO = { listo: function () { return !!st.pago; }, html: function () {
  return '<h1>¿Cómo pagas?</h1><p class="ayuda">Total: <b>' + dinero(total()) + '</b>' + (envio() ? ' (con envío)' : '') + '</p><div class="grid g2">' +
    M.pagos.map(function (x) { return '<button class="op' + (st.pago === x ? ' on' : '') + '" data-pago="' + esc(x) + '"><span class="ico">' + ({ Efectivo: '💵', Transferencia: '🏦', Tarjeta: '💳' }[x] || '💰') + '</span><b>' + esc(x) + '</b><small>' + ({ Efectivo: 'Al recibir', Transferencia: 'Te pasamos los datos', Tarjeta: 'Terminal al recibir' }[x] || '') + '</small></button>'; }).join('') + '</div>' +
    (st.pago === 'Efectivo' ? '<div class="seccion" style="margin-top:16px">¿Con cuánto pagas? <small>para llevarte cambio</small></div><div class="chips">' + ['Exacto', '$200', '$500', '$1,000'].map(function (x) { return '<button class="chip' + (st.cambio === x ? ' on' : '') + '" data-cambio="' + x + '">' + x + '</button>'; }).join('') + '</div>' : ''); } };
// Eventos: el esquema de Javier (precio por persona, mínimo de órdenes según el horario, lo que incluye y el anticipo).
var EV = function () { return M.eventos || {}; };
var horarios = function () { return (EV().horarios || []).slice().sort(function (a, b) { return a.desde < b.desde ? -1 : 1; }); };
var horarioDe = function (h) { var l = horarios(), r = null; l.forEach(function (x) { if (h >= x.desde) r = x; }); return r || l[l.length - 1] || null; };
var minimo = function () { var h = horarios().filter(function (x) { return x.id === st.ev.horario; })[0]; return h ? h.minimo : 15; };
var listaIncluye = function () { return '<ul class="incl">' + (EV().incluye || []).map(function (x) { return '<li><span>' + esc(x.emoji || '✓') + '</span><div><b>' + esc(x.t) + '</b>' + esc(x.d || '') + '</div></li>'; }).join('') + '</ul>'; };
var EVENTOS = [
  { listo: function () { return !!st.ev.tipo; }, auto: true, html: function () {
    var ico = { 'Cumpleaños': '🎂', 'Boda o XV': '💍', 'Desayuno de oficina': '💼', 'Reunión': '🙌', 'Tornafiesta': '🌙' };
    return '<h1>¿Qué vas a celebrar?</h1><p class="ayuda">En 1 minuto te damos tu cotización.</p><div class="grid g2">' +
      EV().tipos.map(function (x) { return '<button class="op' + (st.ev.tipo === x ? ' on' : '') + '" data-ev-tipo="' + esc(x) + '"><span class="ico">' + (ico[x] || '✨') + '</span><b>' + esc(x) + '</b></button>'; }).join('') + '</div>'; } },
  { listo: function () { return !!st.ev.fecha && !!st.ev.horario; }, html: function () {
    var min = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
    var ico = { manana: '☀️', tarde: '🌤️', noche: '🌙', madrugada: '🌌' };
    return '<h1>¿Cuándo es?</h1><p class="ayuda">El mínimo de órdenes cambia según el horario.</p><label class="campo">Fecha<input type="date" id="ev-fecha" min="' + min + '" value="' + esc(st.ev.fecha) + '"></label>' +
      '<div class="seccion">Horario</div><div class="grid g2">' + (EV().horarios || []).map(function (h) {
        return '<button class="op' + (st.ev.horario === h.id ? ' on' : '') + '" data-ev-hor="' + h.id + '"><span class="ico">' + (ico[h.id] || '🕒') + '</span><b>' + esc(h.nombre) + '</b><span class="p">Mínimo ' + h.minimo + ' órdenes</span></button>'; }).join('') + '</div>' +
      (st.ev.horario ? '<label class="campo" style="margin-top:14px">Hora aproximada<input type="time" id="ev-hora" value="' + esc(st.ev.hora) + '"></label>' : ''); } },
  { listo: function () { return st.ev.personas >= minimo() && st.ev.lugar.trim().length > 3; }, al: function () { if (st.ev.personas < minimo()) st.ev.personas = minimo(); }, html: function () {
    var E = st.ev, m = minimo(), pp = EV().precioPersona;
    return '<h1>¿Cuántos y dónde?</h1><p class="ayuda">Una orden por persona.</p>' +
      '<div class="cant"><button data-ev-pers="-5" aria-label="Menos">−</button><b id="ev-pers-n">' + E.personas + '</b><span>personas<br><small>mínimo ' + m + ' en este horario</small></span><button data-ev-pers="5" aria-label="Más">+</button></div>' +
      '<div class="rango" style="margin:10px 0 4px"><input type="range" id="ev-pers" min="' + m + '" max="' + Math.max(500, m * 4) + '" step="1" value="' + E.personas + '"></div>' +
      (pp ? '<p class="ayuda" id="ev-estim">' + E.personas + ' × ' + dinero(pp) + ' = <b>' + dinero(pp * E.personas) + '</b></p>' : '') +
      '<label class="campo">¿Dónde es? <small style="font-weight:400;color:var(--gris)">colonia, salón o dirección</small><input id="ev-lugar" value="' + esc(E.lugar) + '" placeholder="Ej. Quinta Los Encinos, Santiago"></label>'; } },
  { siFactura: true, listo: function () { return st.ev.factura !== null; }, auto: true, html: function () {
    return '<h1>¿Requieres factura?</h1><p class="ayuda">Para tenerla lista el día del evento.</p><div class="grid g2">' +
      [['si', '🧾', 'Sí, con factura'], ['no', '🙅', 'No, sin factura']].map(function (x) { return '<button class="op' + (st.ev.factura === (x[0] === 'si') ? ' on' : '') + '" data-ev-fac="' + x[0] + '"><span class="ico">' + x[1] + '</span><b>' + x[2] + '</b></button>'; }).join('') + '</div>'; } },
  { listo: function () { return true; }, html: function () {
    var E = st.ev, X = EV(), pp = X.precioPersona, tot = pp ? pp * E.personas : 0, ant = X.anticipo || 0, h = horarios().filter(function (x) { return x.id === E.horario; })[0] || {};
    return '<h1>Tu cotización</h1><p class="ayuda">' + esc(E.tipo) + ' · ' + fechaBonita(E.fecha) + ' · ' + esc(h.nombre || '') + (E.hora ? ' (' + horaBonita(E.hora) + ')' : '') + '</p>' +
      '<div class="caja"><div class="total" style="padding:0"><span>' + E.personas + ' personas</span><span>' + (pp ? dinero(tot) : '$<span class="pend">__</span>') + '</span></div>' +
      '<div class="det">' + (pp ? dinero(pp) + ' por persona' : 'Precio por persona: se cotiza') + ' · ' + esc(E.lugar) + (E.factura === true ? ' · con factura' : E.factura === false ? ' · sin factura' : '') + '</div>' +
      (X.traslado ? '<div class="det">🚚 ' + esc(X.traslado) + '</div>' : '') + '</div>' +
      (ant && pp ? '<div class="caja ant"><div class="tit"><span>Para apartar tu fecha</span><span>' + dinero(tot * ant / 100) + '</span></div><div class="det">' + ant + '% de anticipo · el resto (' + dinero(tot - tot * ant / 100) + ') se liquida el día del evento.</div></div>' : '') +
      '<div class="seccion">El servicio incluye</div>' + listaIncluye() +
      (X.condiciones ? '<p class="nota" style="text-align:left">' + esc(X.condiciones) + '</p>' : ''); } },
];
function horaBonita(h) { if (!h) return ''; var p = h.split(':'), d = new Date(); d.setHours(+p[0], +p[1]); return d.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }); }
var nombres = function (pid, ids) { return ids.map(function (i) { return (opcion(pid, i) || {}).nombre; }).filter(Boolean); };
var pasoListo = function (c) { return M.pasos.every(function (p) { return !p.obligatorio || [].concat(c.e[p.id] || []).length > 0; }); };

var ultimoPaso = -1;
function pintar() {
  var p = PASOS[st.paso], anim = ultimoPaso !== st.paso; ultimoPaso = st.paso;
  $('#barra').innerHTML = PASOS.map(function (_, i) { return '<i class="' + (i <= st.paso ? 'on' : '') + '"></i>'; }).join('');
  $('#main').innerHTML = '<section class="paso' + (anim ? ' anim' : '') + '">' + p.html() + '</section>';
  var ultimo = st.paso === PASOS.length - 1;
  $('#sig-t').textContent = ultimo ? (EVENTO ? 'Enviar a ' + M.negocio : 'Hacer mi pedido') : p.ultimoMenu ? 'Agregar al pedido' : 'Siguiente';
  $('#sig-total').textContent = EVENTO ? '' : (p.menu ? dinero(subtotal() + (pasoListo(st.actual) || precioUnit(st.actual) > M.producto.precio ? precioCajita(st.actual) : 0)) : dinero(total()));
  $('#sig').disabled = !p.listo();
  $('#atras').style.visibility = st.paso === 0 ? 'hidden' : 'visible';
  enlazar();
}
function enlazar() {
  var A = st.actual;
  document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () {
    var p = paso(b.dataset.p), o = opcion(p.id, b.dataset.o); if (!o || o.disponible === false) return;
    if (p.tipo === 'varias') { var l = A.e[p.id], i = l.indexOf(o.id); if (i >= 0) l.splice(i, 1); else l.push(o.id); }
    else A.e[p.id] = o.id;
    pintar(); if (PASOS[st.paso].auto && p.tipo === 'una') setTimeout(avanzar, 260);
  }; });
  document.querySelectorAll('[data-cant]').forEach(function (b) { b.onclick = function () { A.cant = Math.max(1, A.cant + Number(b.dataset.cant)); pintar(); }; });
  document.querySelectorAll('[data-quitar]').forEach(function (b) { b.onclick = function () { st.carrito.splice(Number(b.dataset.quitar), 1); pintar(); }; });
  var otra = $('[data-otra]'); if (otra) otra.onclick = function () { st.paso = 0; pintar(); };
  document.querySelectorAll('[data-ent]').forEach(function (b) { b.onclick = function () { st.entrega = b.dataset.ent; pintar(); var d = $('#dir'); if (d) d.focus(); }; });
  var dir = $('#dir'); if (dir) dir.oninput = function () { st.direccion = dir.value; $('#sig').disabled = !PASOS[st.paso].listo(); };
  var suc = $('#suc'); if (suc) suc.onchange = function () { st.sucursal = suc.value; };
  document.querySelectorAll('[data-pago]').forEach(function (b) { b.onclick = function () { st.pago = b.dataset.pago; pintar(); }; });
  document.querySelectorAll('[data-cambio]').forEach(function (b) { b.onclick = function () { st.cambio = b.dataset.cambio; pintar(); }; });
  var E = st.ev;
  document.querySelectorAll('[data-ev-tipo]').forEach(function (b) { b.onclick = function () { E.tipo = b.dataset.evTipo; pintar(); setTimeout(avanzar, 260); }; });
  var revisa = function () { $('#sig').disabled = !PASOS[st.paso].listo(); };
  var pers = function (n) { E.personas = Math.max(minimo(), n); $('#ev-pers-n').textContent = E.personas; var r = $('#ev-pers'); if (r) r.value = E.personas;
    var es = $('#ev-estim'), pp = EV().precioPersona; if (es && pp) es.innerHTML = E.personas + ' × ' + dinero(pp) + ' = <b>' + dinero(pp * E.personas) + '</b>'; revisa(); };
  document.querySelectorAll('[data-ev-hor]').forEach(function (b) { b.onclick = function () { var h = horarios().filter(function (x) { return x.id === b.dataset.evHor; })[0]; E.horario = h.id; if (!E.hora || horarioDe(E.hora) !== h) E.hora = h.hora || h.desde; pintar(); }; });
  document.querySelectorAll('[data-ev-fac]').forEach(function (b) { b.onclick = function () { E.factura = b.dataset.evFac === 'si'; pintar(); setTimeout(avanzar, 260); }; });
  document.querySelectorAll('[data-ev-pers]').forEach(function (b) { b.onclick = function () { pers(E.personas + Number(b.dataset.evPers)); }; });
  var f = $('#ev-fecha'); if (f) f.oninput = function () { E.fecha = f.value; revisa(); };
  var h = $('#ev-hora'); if (h) h.onchange = function () { E.hora = h.value; var x = horarioDe(h.value); if (x && x.id !== E.horario) { E.horario = x.id; pintar(); } };
  var pr = $('#ev-pers'); if (pr) pr.oninput = function () { pers(Number(pr.value)); };
  var lu = $('#ev-lugar'); if (lu) lu.oninput = function () { E.lugar = lu.value; revisa(); };
}
function avanzar() {
  var p = PASOS[st.paso]; if (!p.listo()) return;
  if (st.paso === PASOS.length - 1) return terminar();
  st.paso++; if (PASOS[st.paso].al) PASOS[st.paso].al(); pintar(); window.scrollTo(0, 0);
}
$('#sig').onclick = function () { if (PASOS) avanzar(); };
$('#atras').onclick = function () {
  if (!PASOS || st.paso === 0) return;
  if (PASOS[st.paso].carrito && st.carrito.length) st.actual = st.carrito.pop();
  st.paso--; pintar();
};

function terminar() {
  var pedido, ahora = new Date().toISOString();
  if (EVENTO) {
    var E = st.ev, X = EV(), pp = X.precioPersona, tot = pp ? pp * E.personas : null, h = horarios().filter(function (x) { return x.id === E.horario; })[0] || {};
    pedido = { tipo: 'evento', canal: CANAL || 'Página', conversacion: CONV, creado_en: ahora,
      texto: '🎉 Quiero cotizar un evento\n' + E.tipo + ' · ' + E.personas + ' personas\n📅 ' + fechaBonita(E.fecha) + ', ' + horaBonita(E.hora) + ' (' + h.nombre + ')\n📍 ' + E.lugar +
        (E.factura !== null ? '\n🧾 ' + (E.factura ? 'Con factura' : 'Sin factura') : '') + (tot ? '\n💰 ' + dinero(tot) + ' (' + dinero(pp) + ' por persona) + traslado' : ''),
      evento: { tipo: E.tipo, fecha: E.fecha, hora: E.hora, personas: E.personas, direccion: E.lugar, horario: h.nombre, factura: E.factura,
        precio_persona: pp || null, monto: tot, anticipo_sugerido: tot && X.anticipo ? tot * X.anticipo / 100 : null,
        notas: (h.nombre ? 'Horario: ' + h.nombre + ' (mínimo ' + h.minimo + ')' : '') + (E.factura !== null ? ' · ' + (E.factura ? 'requiere factura' : 'sin factura') : '') + ' · traslado por cotizar' } };
  } else {
    var items = st.carrito.map(function (c) {
      var el = {}; M.pasos.forEach(function (p) { var n = nombres(p.id, [].concat(c.e[p.id] || [])); if (n.length) el[p.id] = n; });
      return { cantidad: c.cant, producto: M.producto.nombre, precio_unit: precioUnit(c), total: precioCajita(c), elecciones: el, resumen: resumen(c) }; });
    pedido = { tipo: 'pedido', canal: CANAL || 'Página', conversacion: CONV, creado_en: ahora, items: items,
      entrega: st.entrega, direccion: st.entrega === 'domicilio' ? st.direccion : null, sucursal: st.entrega === 'recoger' ? st.sucursal : null,
      pago: st.pago, cambio: st.pago === 'Efectivo' ? st.cambio : null, subtotal: subtotal(), envio: envio(), total: total(),
      texto: '🛒 Mi pedido\n' + items.map(function (i) { return '• ' + i.cantidad + ' × ' + i.resumen; }).join('\n') +
        '\n' + (st.entrega === 'domicilio' ? '🛵 A domicilio: ' + st.direccion : '🏪 Paso por él a ' + st.sucursal) +
        '\n💳 ' + st.pago + (st.cambio && st.pago === 'Efectivo' ? ' (pago con ' + st.cambio + ')' : '') + '\nTotal: ' + dinero(total()) };
  }
  if (CONFIG.pedidoUrl) fetch(CONFIG.pedidoUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pedido) }).catch(function () {});
  if (DENTRO) window.parent.postMessage({ chilabike: true, pedido: pedido }, '*');
  try { var l = JSON.parse(localStorage.getItem('chilabike-demo-pedidos') || '[]'); l.push(pedido); localStorage.setItem('chilabike-demo-pedidos', JSON.stringify(l)); } catch (e) {}
  $('#barra').innerHTML = PASOS.map(function () { return '<i class="on"></i>'; }).join('');
  $('#main').innerHTML = '<div class="listo"><div class="ok"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#121110" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>' +
    '<h1>' + (EVENTO ? '¡Ya llegó tu solicitud!' : '¡Pedido enviado!') + '</h1><p class="ayuda">' + (CANAL ? 'Regresa al chat de ' + CANAL + ': ahí te confirmamos' : 'Te confirmamos por WhatsApp') + (EVENTO ? ' tu cotización.' : ' y te avisamos cuando salga tu pedido.') + '</p>' +
    '<div class="caja" style="text-align:left;white-space:pre-line">' + esc(pedido.texto) + '</div>' +
    (DENTRO ? '' : '<p class="nota">Demo: el pedido aparece en Chilabike → Pedidos del portal (unaria.mx/demo/?demo=chilabike) si lo abres en este navegador.</p>') + '</div>';
  document.querySelector('.pie').style.display = 'none';
}
function fechaBonita(iso) { if (!iso) return ''; var t = new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); }
</script>
