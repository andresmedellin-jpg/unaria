  <!-- Pantalla de acceso -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="login-logos"></div>
      <p class="login-sub">Inicia sesión con tu usuario</p>
      <form id="login-form" autocomplete="on">
        <label>Usuario
          <input type="text" id="login-user" required autocomplete="username" autocapitalize="none"
                 autocorrect="off" spellcheck="false" placeholder="tu usuario">
        </label>
        <label>Contraseña
          <input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        <button type="button" class="link-btn" id="login-olvide">¿Olvidaste tu contraseña?</button>
        <p class="login-msg" id="login-msg" role="status"></p>
      </form>
    </div>
  </section>

    </div>
  </div>

  <script>
    // Con ?demo la plataforma corre con datos de ejemplo en memoria (js/demo/), sin conectarse a la base real.
    {  // unaria.mx/demo/ siempre corre en modo demostración (?demo=inmobiliaria cambia de ejemplo)
      // ?demo=chilabike: mensajes de WhatsApp, Instagram y Facebook, eventos y anuncios (js/demo/datos-chilabike.js)
      // ?demo=chilabike (o ?demo=javi): todos los negocios de Javi; Curandero con ventas de Loyverse (js/demo/datos-loyverse.js)
      const javi = /[?&]demo=(chilabike|javi)/i.test(location.search), datos = javi ? 'datos-chilabike' : 'datos-demo';
      // Reloj de la demo de Grupo A.M: Chilabike vende de 8 am a 2 pm. Si la demo se abre fuera de ese horario, el reloj de la
      // demo corre desde las 11:40 am de hoy (sigue avanzando), para que pedidos, pulso y "EN VIVO" se vean como en un día real.
      if (javi && !/[?&]reloj=real/.test(location.search)) {
        const real = new Date(), h = real.getHours() + real.getMinutes() / 60;
        if (h < 8 || h >= 14) {
          const meta = new Date(real); meta.setHours(11, 40, 0, 0);
          const off = meta.getTime() - real.getTime(), RD = Date;
          class RelojDemo extends RD {
            constructor(...a) { if (a.length) super(...a); else super(RD.now() + off); }
            static now() { return RD.now() + off; }
          }
          window.Date = RelojDemo;
        }
      }
      if (javi) document.write('<script src="./chilabike/menu-ejemplo.js?v=20261109-1130"><\/script>');
      if (javi) document.write('<script src="./js/demo/datos-loyverse.js?v=20261109-1130"><\/script>');
      document.write('<script src="./js/demo/' + datos + '.js?v=20261109-1130"><\/script><script src="./js/demo/supabase-demo.js?v=20261109-1130"><\/script>');
    }
  </script>
